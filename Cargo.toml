[package]
name = "renderer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rayon = "1.5"
itertools = "0.10.2"
png = "0.16.8"
sha2 = "0.10"

[features]
# Contagem de chamadas por linha para o Librarian (src/count.rs).
librarian-count = []

# As cenas de cada capítulo do livro: fora de src, para não entrarem no grafo do Librarian.
[[bin]]
name = "cap1"
path = "caps/cap1.rs"

